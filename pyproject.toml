[project]
name = "orchestrator"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "starlette",
  "uvicorn",
  "sqlalchemy",
  "aiosqlite",
  "alembic",
  "httpx",
  "jinja2",
  "authlib",
  "itsdangerous",
  "websockets",
  "python-multipart>=0.0.22",
]

[dependency-groups]
dev = ["mypy>=1.19.1", "pytest", "pytest-asyncio", "ruff"]
