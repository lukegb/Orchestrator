<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Orchestrator</title>
        <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f4f4f9; color: #333; margin: 0; padding: 0; }
        header { background: #24292e; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
        .card { background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); padding: 1.5rem; margin-bottom: 2rem; }
        .btn { display: inline-block; padding: 0.5rem 1rem; border-radius: 4px; text-decoration: none; font-weight: bold; font-size: 0.9rem; cursor: pointer; border: none; }
        .btn-primary { background: #0366d6; color: white; }
        .btn-primary:hover { background: #0056b3; }
        .btn-danger { background: #d73a49; color: white; }
        .btn-danger:hover { background: #b32d3a; }
        .btn-outline { background: transparent; border: 1px solid #e1e4e8; color: #24292e; }
        .btn-outline:hover { background: #f3f4f6; }
        .btn-success { background: #28a745; color: white; }
        .btn-success:hover { background: #22863a; }
        
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .justify-between { justify-content: space-between; }
        .justify-end { justify-content: flex-end; }
        .align-center { align-items: center; }
        .align-start { align-items: flex-start; }
        .gap-1 { gap: 0.5rem; }
        .gap-2 { gap: 1rem; }
        .gap-4 { gap: 2rem; }
        .flex-wrap { flex-wrap: wrap; }
        
        .text-center { text-align: center; }
        .text-white { color: white !important; }
        .text-muted { color: #586069; }
        .text-sm { font-size: 0.9rem; }
        .text-xs { font-size: 0.8rem; }
        .text-lg { font-size: 1.1rem; }
        
        .m-0 { margin: 0; }
        .mt-0 { margin-top: 0; }
        .mb-0 { margin-bottom: 0; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .ml-4 { margin-left: 1rem; }
        .my-2 { margin-top: 0.5rem; margin-bottom: 0.5rem; }
        .p-2 { padding: 0.5rem; }
        .p-4 { padding: 1rem; }
        .px-3 { padding-left: 0.8rem; padding-right: 0.8rem; }
        .py-3 { padding-top: 0.8rem; padding-bottom: 0.8rem; }
        .px-2 { padding-left: 0.4rem; padding-right: 0.4rem; }
        .py-1 { padding-top: 0.1rem; padding-bottom: 0.1rem; }
        .py-12 { padding-top: 3rem; padding-bottom: 3rem; }
        .w-full { width: 100%; }
        .max-w-xs { max-width: 250px; }
        
        .border-white { border-color: white !important; }
        .border-bottom { border-bottom: 2px solid #eee; }
        .border-top { border-top: 1px solid #ccc; }
        .border-all { border: 1px solid #e1e4e8; }
        .pb-2 { padding-bottom: 0.5rem; }
        .bg-light { background: #f9f9f9; }
        .bg-success { background: #28a745; }
        .bg-danger { background: #cb2431; }
        .bg-neutral { background: #e1e4e8; }
        .text-dark { color: #24292e; }
        .rounded { border-radius: 4px; }
        .rounded-lg { border-radius: 6px; }
        .font-mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
        .alert { padding: 1rem; border-radius: 6px; }
        .alert-warning { background: #fff3cd; border: 1px solid #ffc107; color: #856404; }
        .deploy-prompt { background: #fffbf0; border-color: #ffc107 !important; }
        code { background: #f1f1f1; padding: 0.15rem 0.4rem; border-radius: 3px; }
        .mt-2 { margin-top: 0.5rem; }
        .log-viewer-container { position: relative; background: #1e1e2e; border-radius: 6px; height: 70vh; overflow-y: auto; }
        .log-viewer { margin: 0; padding: 1rem; color: #cdd6f4; font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 0.8rem; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
        .scroll-to-bottom-btn { position: absolute; bottom: 1rem; right: 1rem; background: #0366d6; color: white; border: none; border-radius: 50%; width: 36px; height: 36px; cursor: pointer; font-size: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
        .scroll-to-bottom-btn:hover { background: #0056b3; }
        </style>
    </head>
    <body>
        <header>
            <h2>Orchestrator</h2>
            <div>
                {% if user %}
                    <span>Hello, {{ user.login }}</span>
                    <a href="/logout" class="btn btn-outline ml-4 text-white border-white">Logout</a>
                {% endif %}
            </div>
        </header>
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </body>
</html>
